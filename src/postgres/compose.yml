services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-huybrechts}
      POSTGRES_USER: ${POSTGRES_USER:-huybrechts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-develop}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huybrechts} -d ${POSTGRES_DB:-huybrechts}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
